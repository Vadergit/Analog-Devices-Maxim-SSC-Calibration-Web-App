name: ESP32-C3 and Pro Micro firmware builds
on:
  push:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:
jobs:
  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core install esp32:esp32@3.3.0 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli compile --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc --output-dir build firmware/esp32c3_max40109
      - uses: actions/upload-artifact@v4
        with:
          name: max40109-esp32c3-firmware-v4
          path: build/
  promicro:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cpu: [16MHzatmega32U4, 8MHzatmega32U4]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/sparkfun/Arduino_Boards/master/IDE_Board_Manager/package_sparkfun_index.json
      - run: arduino-cli core install SparkFun:avr --additional-urls https://raw.githubusercontent.com/sparkfun/Arduino_Boards/master/IDE_Board_Manager/package_sparkfun_index.json
      - run: arduino-cli compile --fqbn SparkFun:avr:promicro:cpu=${{ matrix.cpu }} --output-dir build firmware/promicro_max40109
      - uses: actions/upload-artifact@v4
        with:
          name: max40109-promicro-${{ matrix.cpu }}-v4
          path: build/
