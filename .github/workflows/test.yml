name: Host math tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.mjs && node --check bridge.mjs && node --check max40109.mjs && node --test tests/*.test.mjs

      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 --bind 127.0.0.1 & npx playwright test tests/browser.spec.mjs --workers=1 --reporter=list

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
